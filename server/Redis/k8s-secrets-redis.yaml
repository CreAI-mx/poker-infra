# IMPORTANTE: Este archivo contiene plantillas de secrets que deben ser configurados
# antes del despliegue. NO commitear este archivo con valores reales de producción.
#
# El secret `redis-creai-cs` es referenciado en el deployment (k8s-deployment.yaml)
# y contiene la URL de conexión a Redis con autenticación.
#
# OPCIÓN 1: Crear el secret usando kubectl (RECOMENDADO)
# ----------------------------------------
# Ejecuta el siguiente comando para crear el secret directamente:
#
# kubectl create secret generic redis-creai-cs \
#   --from-literal=REDIS_URL="redis://:STRONG_PASS@127.0.0.1:6379" \
#   -n eca-services
#
# OPCIÓN 2: Usar este archivo YAML (con valores codificados en base64)
# ----------------------------------------
# 1. Codifica tus valores en base64:
#    echo -n "redis://:STRONG_PASS@127.0.0.1:6379" | base64
#
# 2. Reemplaza los valores en la sección `data:` de este archivo
# 3. Aplica el secret:
#    kubectl apply -f k8s-secrets-redis.yaml

apiVersion: v1
kind: Secret
metadata:
  name: redis-creai-cs
  namespace: eca-services
  labels:
    app: redis
    component: cache
type: Opaque
data:
  # Redis URL with authentication (base64 encoded)
  # Ejemplo: echo -n "redis://:STRONG_PASS@127.0.0.1:6379" | base64
  # Valor de ejemplo (cambiar en producción): redis://:STRONG_PASS@127.0.0.1:6379
  REDIS_URL: cmVkaXM6Ly86U1RST05HX1BBU1NAMTI3LjAuMC4xOjYzNzk=
